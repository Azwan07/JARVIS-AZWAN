<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>JARVIS AZWAN</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 background:#020304;color:#e9faff;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 overflow:hidden
}
body{
 background:
 radial-gradient(circle at 50% 42%,rgba(255,120,0,.08),transparent 28%),
 radial-gradient(circle at 50% 50%,#101010 0%,#030405 60%,#000 100%);
}
.app{height:100%;display:flex;flex-direction:column}
header{
 height:64px;padding:10px 14px;
 display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid rgba(255,120,0,.5);
 background:rgba(0,0,0,.7);
}
.brand{color:#ff8a00;font-weight:800;letter-spacing:2px}
.sub{font-size:9px;color:#6defff;letter-spacing:2px}
.status{font-size:10px;color:#6defff}
main{
 flex:1;position:relative;display:flex;
 align-items:center;justify-content:center;
 overflow:hidden;
}
.core{
 position:relative;
 width:min(72vw,390px);
 height:min(72vw,390px);
}
.core canvas{
 position:absolute;inset:0;width:100%;height:100%;
}
.core-label{
 position:absolute;inset:0;
 display:flex;flex-direction:column;
 align-items:center;justify-content:center;
 pointer-events:none;
 text-align:center;
}
.core-label strong{
 color:#ff9a18;font-size:28px;
 letter-spacing:7px;
 text-shadow:0 0 15px #ff6a00,0 0 40px #ff6a00;
}
.core-label span{
 color:#6defff;font-size:10px;
 letter-spacing:4px;margin-top:5px;
}
.panel{
 position:absolute;
 border:1px solid rgba(255,130,0,.45);
 background:rgba(5,8,10,.78);
 box-shadow:0 0 20px rgba(255,100,0,.08);
 backdrop-filter:blur(8px);
 padding:10px;
}
.left{left:10px;top:15px;width:190px}
.right{right:10px;top:15px;width:190px}
.panel h3{
 margin:0 0 8px;color:#ff8a00;
 font-size:10px;letter-spacing:2px
}
.item{
 font-size:10px;color:#b9d9df;
 padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)
}
.item b{color:#6defff}
.bottom{
 position:absolute;bottom:10px;left:50%;
 transform:translateX(-50%);
 width:min(92%,600px);
}
.response{
 min-height:48px;
 color:#dffaff;
 font-size:13px;
 line-height:1.45;
}
.controls{
 display:flex;gap:8px;margin-top:8px
}
input{
 flex:1;background:#070a0c;
 border:1px solid rgba(255,130,0,.5);
 color:white;padding:12px;border-radius:4px;
 outline:none
}
button{
 border:1px solid #ff8a00;
 background:#100b05;
 color:#ff9a18;
 padding:11px 15px;
 border-radius:4px;
 font-weight:700;
}
button:active{transform:scale(.97)}
.mic.on{
 background:#ff6a00;color:#000;
 box-shadow:0 0 18px #ff6a00
}
@media(max-width:700px){
 .left,.right{display:none}
 .core{width:82vw;height:82vw}
 .bottom{bottom:8px}
}
</style>
</head>

<body>
<div class="app">

<header>
 <div>
   <div class="brand">JARVIS AZWAN</div>
   <div class="sub">PERSONAL AI ASSISTANT</div>
 </div>
 <div class="status" id="status">READY</div>
</header>

<main>

 <section class="panel left">
   <h3>TODAY'S TASKS</h3>
   <div class="item"><b>01</b> Building maintenance</div>
   <div class="item"><b>02</b> Vendor follow-up</div>
   <div class="item"><b>03</b> Payment tracking</div>
   <div class="item"><b>04</b> Report preparation</div>
 </section>

 <div class="core">
   <canvas id="coreCanvas"></canvas>
   <div class="core-label">
     <strong>JARVIS</strong>
     <span>AZWAN CORE</span>
   </div>
 </div>

 <section class="panel right">
   <h3>CORE STATUS</h3>
   <div class="item">BRAIN <b>READY</b></div>
   <div class="item">MEMORY <b>ACTIVE</b></div>
   <div class="item">VOICE <b id="voiceState">READY</b></div>
   <div class="item">SECURITY <b>LOCKED</b></div>
 </section>

 <section class="panel bottom">
   <div class="response" id="response">
     Good morning, Azwan. JARVIS is ready.
   </div>

   <div class="controls">
     <input id="command" placeholder="Talk to JARVIS..." autocomplete="off">
     <button id="send">SEND</button>
     <button id="mic" class="mic">🎙</button>
   </div>
 </section>

</main>
</div>

<script>
/* =========================================================
   JARVIS AZWAN CORE
   ========================================================= */

const canvas=document.getElementById("coreCanvas");
const ctx=canvas.getContext("2d");
let W,H,DPR;
let speaking=false;
let listening=false;

function resize(){
 DPR=window.devicePixelRatio||1;
 const r=canvas.getBoundingClientRect();
 W=r.width;H=r.height;
 canvas.width=W*DPR;
 canvas.height=H*DPR;
 ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize",resize);
resize();

const particles=[];
for(let i=0;i<260;i++){
 particles.push({
   a:Math.random()*Math.PI*2,
   r:.12+Math.random()*.42,
   z:Math.random(),
   s:.002+Math.random()*.009,
   size:.4+Math.random()*1.8
 });
}

function drawCore(t){
 ctx.clearRect(0,0,W,H);

 const cx=W/2,cy=H/2;
 const R=Math.min(W,H)*.34;

 ctx.save();
 ctx.translate(cx,cy);

 /* outer holographic rings */
 for(let i=0;i<7;i++){
   const rr=R*(1.05+i*.11);
   ctx.beginPath();
   ctx.arc(0,0,rr,t*.0002*(i%2?1:-1)+i*.7,
                  t*.0002*(i%2?1:-1)+i*.7+Math.PI*1.35);
   ctx.strokeStyle=`rgba(255,${120+i*12},20,${.12-i*.011})`;
   ctx.lineWidth=i%2?1:.7;
   ctx.stroke();
 }

 /* energy field */
 const g=ctx.createRadialGradient(0,0,0,0,0,R*1.2);
 g.addColorStop(0,"rgba(255,230,150,.9)");
 g.addColorStop(.08,"rgba(255,150,20,.75)");
 g.addColorStop(.28,"rgba(255,80,0,.25)");
 g.addColorStop(.65,"rgba(255,70,0,.06)");
 g.addColorStop(1,"rgba(255,60,0,0)");
 ctx.fillStyle=g;
 ctx.beginPath();
 ctx.arc(0,0,R*1.2,0,Math.PI*2);
 ctx.fill();

 /* rotating orbital energy */
 for(let j=0;j<9;j++){
   ctx.save();
   ctx.rotate(t*.0004*(j%2?1:-1)+j*.7);
   ctx.beginPath();
   ctx.ellipse(
     0,0,
     R*(.65+j*.045),
     R*(.16+j*.012),
     0,0,Math.PI*2
   );
   ctx.strokeStyle=`rgba(255,${110+j*15},25,${.25-j*.018})`;
   ctx.stroke();
   ctx.restore();
 }

 /* particles */
 for(const p of particles){
   p.a+=p.s;
   const rr=R*(.35+p.r);
   const x=Math.cos(p.a)*rr;
   const y=Math.sin(p.a)*rr*.62;

   ctx.fillStyle=`rgba(255,${100+Math.random()*100},30,${.3+p.z*.7})`;
   ctx.beginPath();
   ctx.arc(x,y,p.size,0,Math.PI*2);
   ctx.fill();

   if(p.z>.7){
     ctx.strokeStyle="rgba(255,130,30,.18)";
     ctx.beginPath();
     ctx.moveTo(x,y);
     ctx.lineTo(x*.72,y*.72);
     ctx.stroke();
   }
 }

 /* central energy nucleus */
 const pulse=1+
   Math.sin(t*.004)*(speaking?.10:.035)+
   Math.sin(t*.009)*.018;

 const coreR=R*.27*pulse;

 const cg=ctx.createRadialGradient(0,0,0,0,0,coreR*1.8);
 cg.addColorStop(0,"rgba(255,255,220,1)");
 cg.addColorStop(.08,"rgba(255,190,60,.95)");
 cg.addColorStop(.35,"rgba(255,100,0,.55)");
 cg.addColorStop(1,"rgba(255,50,0,0)");

 ctx.fillStyle=cg;
 ctx.beginPath();
 ctx.arc(0,0,coreR*1.8,0,Math.PI*2);
 ctx.fill();

 for(let k=0;k<35;k++){
   const a=t*.001*(k%2?1:-1)+k;
   const len=coreR*(.5+Math.random()*.8);
   ctx.strokeStyle="rgba(255,160,40,.45)";
   ctx.beginPath();
   ctx.moveTo(Math.cos(a)*coreR*.3,Math.sin(a)*coreR*.3);
   ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len);
   ctx.stroke();
 }

 ctx.restore();
 requestAnimationFrame(drawCore);
}
requestAnimationFrame(drawCore);


/* =========================================================
   VOICE
   ========================================================= */

const response=document.getElementById("response");
const status=document.getElementById("status");
const voiceState=document.getElementById("voiceState");
const mic=document.getElementById("mic");
const command=document.getElementById("command");

let recognition=null;

function setStatus(x){
 status.textContent=x;
}

async function startMic(){

 if(listening){
   stopMic();
   return;
 }

 try{
   if(!navigator.mediaDevices?.getUserMedia){
     throw new Error("Microphone API unavailable");
   }

   await navigator.mediaDevices.getUserMedia({
     audio:{
       echoCancellation:true,
       noiseSuppression:true,
       autoGainControl:true
     }
   });

   const SR=window.SpeechRecognition||
            window.webkitSpeechRecognition;

   if(!SR){
     throw new Error("Speech recognition is not supported by this browser");
   }

   recognition=new SR();

   recognition.lang="ms-MY";
   recognition.continuous=false;
   recognition.interimResults=false;
   recognition.maxAlternatives=1;

   recognition.onstart=()=>{
     listening=true;
     mic.classList.add("on");
     voiceState.textContent="LISTENING";
     setStatus("LISTENING");
     response.textContent="I'm listening, Azwan...";
   };

   recognition.onresult=(event)=>{
     const text=event.results[0][0].transcript;
     command.value=text;
     stopMic();
     ask(text);
   };

   recognition.onerror=(event)=>{
     stopMic();
     response.textContent=
       "Microphone error: "+event.error;
   };

   recognition.onend=()=>{
     listening=false;
     mic.classList.remove("on");
     voiceState.textContent="READY";
     setStatus("READY");
   };

   recognition.start();

 }catch(err){
   stopMic();
   response.textContent=
     "Microphone unavailable. Allow microphone access for this site in Safari Settings.";
   console.error(err);
 }
}

function stopMic(){
 try{recognition?.stop()}catch(e){}
 listening=false;
 mic.classList.remove("on");
 voiceState.textContent="READY";
 setStatus("READY");
}

mic.onclick=startMic;


/* =========================================================
   SPEECH
   ========================================================= */

function speak(text){

 if(!("speechSynthesis" in window)) return;

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);

 u.lang="en-GB";
 u.rate=.96;
 u.pitch=.82;
 u.volume=1;

 const voices=speechSynthesis.getVoices();

 const preferred=[
   "Daniel",
   "Oliver",
   "Arthur",
   "Google UK English Male"
 ];

 let v=null;

 for(const name of preferred){
   v=voices.find(x=>x.name.includes(name));
   if(v)break;
 }

 if(!v){
   v=voices.find(x=>x.lang==="en-GB" && /male/i.test(x.name));
 }

 if(v)u.voice=v;

 u.onstart=()=>{
   speaking=true;
   setStatus("SPEAKING");
 };

 u.onend=()=>{
   speaking=false;
   setStatus("READY");
 };

 speechSynthesis.speak(u);
}

speechSynthesis?.addEventListener?.(
 "voiceschanged",
 ()=>speechSynthesis.getVoices()
);


/* =========================================================
   JARVIS BRAIN CONNECTION
   ========================================================= */

async function ask(text){

 text=(text||"").trim();
 if(!text)return;

 response.textContent="Analysing...";
 setStatus("PROCESSING");

 try{

   const r=await fetch("/api/chat",{
     method:"POST",
     headers:{"Content-Type":"application/json"},
     body:JSON.stringify({
       message:text
     })
   });

   if(!r.ok)throw new Error("AI backend unavailable");

   const data=await r.json();

   const answer=data.answer||
                data.message||
                "I received the request.";

   response.textContent=answer;
   speak(answer);

 }catch(err){

   console.error(err);

   const fallback=
     "The JARVIS interface is working, but the AI brain gateway is not connected yet.";

   response.textContent=fallback;
   speak(fallback);
   setStatus("BRAIN OFFLINE");
 }
}


/* =========================================================
   TEXT COMMAND
   ========================================================= */

document.getElementById("send").onclick=()=>{
 ask(command.value);
 command.value="";
};

command.addEventListener("keydown",e=>{
 if(e.key==="Enter"){
   ask(command.value);
   command.value="";
 }
});
</script>

</body>
</html>
