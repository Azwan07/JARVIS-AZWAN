<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050505"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="JARVIS AZWAN"><link rel="manifest" href="manifest.webmanifest"><title>JARVIS AZWAN</title><style>
:root{--bg:#020202;--p:#0d0906;--orange:#ff8a00;--amber:#ffc15a;--cyan:#00e5ff;--white:#f4f4f4;--muted:#8c8176;--red:#ff3b30}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100%;overflow-x:hidden}body{min-height:100vh}
button,input,textarea{font:inherit}button{color:inherit}
.app{max-width:1100px;margin:auto;min-height:100vh;padding:16px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{letter-spacing:.18em;font-size:12px;color:var(--amber);font-weight:700}
.status{font-size:10px;letter-spacing:.12em;color:var(--muted)}
.coreWrap{position:relative;width:min(76vw,430px);aspect-ratio:1;margin:28px auto 14px;display:grid;place-items:center}
.coreGlow{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle,rgba(255,138,0,.28),rgba(255,138,0,.08) 42%,transparent 68%);filter:blur(18px);animation:glow 2.5s ease-in-out infinite}
.core{position:relative;width:88%;height:88%;border-radius:50%;overflow:hidden;border:1px solid rgba(255,161,42,.6);box-shadow:0 0 35px rgba(255,138,0,.35),inset 0 0 35px rgba(255,138,0,.16);background:#090604}
.core img{width:100%;height:100%;object-fit:cover;display:block}
.ring{position:absolute;inset:1%;border:1px solid rgba(255,177,71,.4);border-radius:50%;animation:spin 18s linear infinite}
.ring.r2{inset:8%;border-style:dashed;animation:spin 11s linear reverse infinite;opacity:.65}
.talk{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,193,90,.0);pointer-events:none}
.talking .talk{animation:pulse .7s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes glow{50%{transform:scale(1.05);opacity:.75}}@keyframes pulse{50%{transform:scale(1.04);border-color:rgba(255,193,90,.8)}}
.panel{border:1px solid rgba(255,138,0,.35);background:linear-gradient(180deg,rgba(20,12,6,.82),rgba(5,5,5,.88));border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mode{font-size:11px;letter-spacing:.12em;color:var(--cyan);border:1px solid rgba(255,138,0,.4);padding:7px 9px;border-radius:8px;background:#070707}
.mode.active{background:rgba(0,229,255,.08);border-color:var(--orange)}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.btn{border:1px solid rgba(255,138,0,.5);background:#0a0705;border-radius:10px;padding:12px 10px;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.primary{background:rgba(255,138,0,.12);border-color:var(--orange)}
.btn.cyan{color:var(--cyan)}
.log{height:160px;overflow:auto;font-size:12px;line-height:1.5;color:#d7d0ca;white-space:pre-wrap}
input,textarea{width:100%;background:#050505;border:1px solid rgba(255,138,0,.35);border-radius:9px;color:white;padding:11px;outline:none}
textarea{min-height:70px;resize:vertical}
.small{font-size:10px;color:var(--muted)}
@media(min-width:700px){.controls{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main class="app">
<div class="top"><div class="brand">JARVIS AZWAN</div><div id="status" class="status">READY</div></div>
<div id="coreWrap" class="coreWrap"><div class="coreGlow"></div><div class="core"><img src="assets/jarvis-core-reference.png" alt="JARVIS Core"><div class="ring"></div><div class="ring r2"></div><div class="talk"></div></div></div>
<div class="panel"><div class="small">COMMAND MODES</div><div class="row" id="modes"></div></div>
<div class="panel"><div class="controls">
<button class="btn primary" id="mic">🎙️ LISTEN</button>
<button class="btn cyan" id="work">WORK MODE</button>
<button class="btn" id="private">PRIVATE</button>
<button class="btn" id="ambient">AMBIENT</button>
</div></div>
<div class="panel"><div class="small">COMMAND</div><textarea id="cmd" placeholder="Type a command or use the microphone..."></textarea><button class="btn primary" id="send" style="width:100%;margin-top:8px">EXECUTE</button></div>
<div class="panel"><div class="small">JARVIS LOG</div><div id="log" class="log"></div></div>
<div class="panel"><div class="small">MEMORY</div><div id="memory" class="small">Local context active</div></div>
</main>
